name: global-exchange

services:
  postgres:
    image: postgres:17-alpine
    container_name: global-exchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-global_exchange}
      POSTGRES_USER: ${DB_USER:-global_exchange}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-global_exchange_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-global_exchange} -d ${DB_NAME:-global_exchange}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [global_exchange]

  mailpit:
    image: axllent/mailpit
    container_name: global-exchange-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [global_exchange]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: global-exchange-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${DB_USER:-global_exchange}
      KC_DB_PASSWORD: ${DB_PASSWORD:-global_exchange_dev}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/global-exchange-realm.json:/opt/keycloak/data/import/global-exchange-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [global_exchange]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: global-exchange-web
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:-global_exchange}
      DB_USER: ${DB_USER:-global_exchange}
      DB_PASSWORD: ${DB_PASSWORD:-global_exchange_dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-global-exchange}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-global-exchange-web}
      KEYCLOAK_EXPECTED_ISSUER: ${KEYCLOAK_EXPECTED_ISSUER:-http://localhost:8080/realms/global-exchange}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-http://localhost:8000/usuarios/callback/}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      OIDC_LOGIN_SUCCESS_URL: ${OIDC_LOGIN_SUCCESS_URL:-}
      OIDC_REGISTRATION_SUCCESS_URL: ${OIDC_REGISTRATION_SUCCESS_URL:-}
      OIDC_ERROR_URL: ${OIDC_ERROR_URL:-}
      SESSION_COOKIE_HTTPONLY: ${SESSION_COOKIE_HTTPONLY:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${DJANGO_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [global_exchange]

volumes:
  postgres_data:

networks:
  global_exchange:
    driver: bridge
